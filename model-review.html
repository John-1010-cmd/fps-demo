<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>模型评审台</title>
<style>
  html, body { margin: 0; height: 100%; background: #d8d8d8; overflow: hidden; font-family: Microsoft YaHei, Arial, sans-serif; }
  body { display: flex; }
  #ref { flex: 0 0 auto; height: 100vh; display: flex; align-items: center; background: #cfcfcf; }
  #ref img { height: 100vh; width: auto; display: block; }
  #stage { position: relative; flex: 1 1 auto; height: 100vh; }
  #gl { width: 100%; height: 100%; display: block; }
  .vlabel { position: absolute; top: 6px; font: bold 15px/1.4 Arial, sans-serif; color: #444;
    background: rgba(255,255,255,.75); padding: 2px 10px; border-radius: 3px; pointer-events: none; }
  #err { position: fixed; left: 8px; bottom: 8px; color: #b00; font: 13px/1.5 monospace; white-space: pre-wrap; z-index: 9; }
</style>
<script type="importmap">
{ "imports": { "three": "./js/vendor/three.module.js" } }
</script>
</head>
<body>
<div id="ref"><img id="ref-img" alt="reference"></div>
<div id="stage"><canvas id="gl"></canvas><div id="err"></div></div>
<script type="module" src="./js/model-review.js"></script>
</body>
</html>
